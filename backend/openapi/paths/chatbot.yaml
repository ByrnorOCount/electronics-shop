chatbot:
  post:
    summary: Ask the local product assistant
    description: Streams an answer using general knowledge and current catalog/FAQ context. Chat history is not stored.
    operationId: chatWithProductAssistant
    tags:
      - AI Assistant
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - message
            properties:
              message:
                type: string
                minLength: 1
                maxLength: 4000
              history:
                type: array
                maxItems: 12
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - role
                    - content
                  properties:
                    role:
                      type: string
                      enum: [user, assistant]
                    content:
                      type: string
                      minLength: 1
                      maxLength: 4000
    responses:
      "200":
        description: Newline-delimited stream of loading, token, done, or error events.
        content:
          application/x-ndjson:
            schema:
              type: string
      "400":
        description: Invalid message or conversation history.
      "503":
        description: Local Ollama service is unavailable.